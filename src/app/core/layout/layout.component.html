<!-- Contenedor raíz del shell.
     layout--collapsed: sidebar estrecho en desktop (solo iconos).
     layout--mobile-open: drawer del sidebar visible en mobile. -->
<div class="layout"
     [class.layout--collapsed]="sidebarCollapsed()"
     [class.layout--mobile-open]="mobileOpen()">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">

    <!-- Marca: logo + nombre de la app -->
    <div class="sidebar__brand">
      <span class="sidebar__logo">B</span>
      <span class="sidebar__label">BizCore</span>
    </div>

    <!-- Navegación principal.
         routerLinkActive agrega la clase CSS cuando la ruta está activa. -->
    <nav class="sidebar__nav">
      <!-- (click)="closeMobileSidebar()" cierra el drawer al navegar en mobile -->
      <a
        routerLink="/dashboard"
        routerLinkActive="sidebar__link--active"
        class="sidebar__link"
        title="Dashboard"
        (click)="closeMobileSidebar()"
      >
        <span class="sidebar__icon" aria-hidden="true">⊞</span>
        <span class="sidebar__text">Dashboard</span>
      </a>

      <a
        routerLink="/users"
        routerLinkActive="sidebar__link--active"
        class="sidebar__link"
        title="Usuarios"
        (click)="closeMobileSidebar()"
      >
        <span class="sidebar__icon" aria-hidden="true">👤</span>
        <span class="sidebar__text">Usuarios</span>
      </a>

      <a
        routerLink="/products"
        routerLinkActive="sidebar__link--active"
        class="sidebar__link"
        title="Productos"
        (click)="closeMobileSidebar()"
      >
        <span class="sidebar__icon" aria-hidden="true">📦</span>
        <span class="sidebar__text">Productos</span>
      </a>

      <a
        routerLink="/inventory"
        routerLinkActive="sidebar__link--active"
        class="sidebar__link"
        title="Inventario"
        (click)="closeMobileSidebar()"
      >
        <span class="sidebar__icon" aria-hidden="true">🗃️</span>
        <span class="sidebar__text">Inventario</span>
      </a>

      <a
        routerLink="/suppliers"
        routerLinkActive="sidebar__link--active"
        class="sidebar__link"
        title="Proveedores"
        (click)="closeMobileSidebar()"
      >
        <span class="sidebar__icon" aria-hidden="true">🚚</span>
        <span class="sidebar__text">Proveedores</span>
      </a>

      <a
        routerLink="/orders"
        routerLinkActive="sidebar__link--active"
        class="sidebar__link"
        title="Pedidos"
        (click)="closeMobileSidebar()"
      >
        <span class="sidebar__icon" aria-hidden="true">🧾</span>
        <span class="sidebar__text">Pedidos</span>
      </a>
    </nav>

  </aside>

  <!-- Overlay semitransparente para mobile.
       Cubre el contenido cuando el drawer está abierto.
       Al tocarlo, llama a closeMobileSidebar() para cerrar el drawer. -->
  <div class="sidebar-overlay" (click)="closeMobileSidebar()"></div>

  <!-- ===== ZONA DERECHA: navbar + contenido ===== -->
  <div class="layout__main">

    <!-- Navbar superior -->
    <header class="navbar">

      <!-- Botón para colapsar / expandir el sidebar -->
      <button
        class="navbar__toggle"
        type="button"
        (click)="toggleSidebar()"
        [attr.aria-label]="sidebarCollapsed() ? 'Expandir menú' : 'Colapsar menú'"
      >
        <span aria-hidden="true">☰</span>
      </button>

      <!-- Info del usuario logueado + botón de logout -->
      <div class="navbar__user">
        <div class="navbar__user-info">
          <span class="navbar__username">{{ currentUser()?.sub }}</span>
          <span class="navbar__role">{{ currentUser()?.role }}</span>
        </div>
        <button class="navbar__logout" type="button" (click)="logout()">
          Salir
        </button>
      </div>

    </header>

    <!-- Contenido del módulo activo.
         router-outlet renderiza aquí el hijo correspondiente a la URL actual. -->
    <main class="layout__content">
      <router-outlet />
    </main>

  </div>

</div>

<!-- Spinner global: vive fuera del layout para superponerse a TODO,
     incluido el sidebar. Se activa automáticamente en cada petición HTTP. -->
<app-loading-spinner />

<!-- Snackbar global: muestra notificaciones de éxito/error tras operaciones.
     Vive fuera del router-outlet para persistir entre navegaciones. -->
<app-snackbar />

<!-- Confirm dialog global: solicita confirmación antes de acciones destructivas.
     Overlay que bloquea la UI hasta que el usuario responda. -->
<app-confirm-dialog />
